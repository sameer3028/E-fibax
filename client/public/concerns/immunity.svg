  <path d="M18 20 L20 23 L23 24.5 L20 26 L18 29 L16 26 L13 24.5 L16 23 Z" fill="#F59E0B"/>
  <path d="M78 20 L80 23 L83 24.5 L80 26 L78 29 L76 26 L73 24.5 L76 23 Z" fill="#F59E0B"/>
  <path d="M48 6 L49.5 9 L52.5 10.5 L49.5 12 L48 15 L46.5 12 L43.5 10.5 L46.5 9 Z" fill="#F59E0B"/>
