<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="painGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <radialGradient id="jointAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#F97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle Soft Tint -->
  <circle cx="48" cy="48" r="46" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="2"/>

  <!-- Pain Radiant Glow -->
  <circle cx="48" cy="48" r="26" fill="url(#jointAura)"/>

  <!-- Upper Bone (Femur) -->
  <path d="M42 8 C42 8 36 10 36 16 C36 21 40 26 40 38 C37 40 34 44 35 48 C37 50 43 49 48 49 C53 49 59 50 61 48 C62 44 59 40 56 38 C56 26 60 21 60 16 C60 10 54 8 54 8 L42 8 Z" fill="url(#boneGrad)" stroke="#94A3B8" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Femur Condyles -->
  <ellipse cx="41" cy="45" rx="5" ry="3.5" fill="#38BDF8" opacity="0.85"/>
  <ellipse cx="55" cy="45" rx="5" ry="3.5" fill="#38BDF8" opacity="0.85"/>

  <!-- Lower Bone (Tibia & Fibula) -->
  <path d="M35 52 C34 56 37 60 40 62 C40 72 36 78 36 84 C36 88 42 90 42 90 L54 90 C54 90 60 88 60 84 C60 78 56 72 56 62 C59 60 62 56 61 52 C57 51 53 51.5 48 51.5 C43 51.5 39 51 35 52 Z" fill="url(#boneGrad)" stroke="#94A3B8" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Tibial Plateau Cartilage -->
  <ellipse cx="41" cy="53" rx="5" ry="3" fill="#38BDF8" opacity="0.85"/>
  <ellipse cx="55" cy="53" rx="5" ry="3" fill="#38BDF8" opacity="0.85"/>

  <!-- Patella (Kneecap) -->
  <ellipse cx="48" cy="48" rx="8" ry="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/>

  <!-- Radiant Pain Sparks & Flash Wave -->
  <path d="M48 37 L50 43 L56 41 L52 46 L58 48 L52 50 L56 55 L50 53 L48 59 L46 53 L40 55 L44 50 L38 48 L44 46 L40 41 L46 43 Z" fill="url(#painGlow)" filter="url(#glow)"/>
  
  <!-- Pain Shockwaves -->
  <path d="M26 44 C24 46.5 24 49.5 26 52" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M21 41 C18 45.5 18 50.5 21 55" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
  <path d="M70 44 C72 46.5 72 49.5 70 52" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M75 41 C78 45.5 78 50.5 75 55" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
</svg>
