<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="heartMuscle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="60%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="aortaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="pulmonaryBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Background Circle Soft Tint -->
  <circle cx="48" cy="48" r="46" fill="#FEF2F2" stroke="#FEE2E2" stroke-width="2"/>

  <!-- Superior Vena Cava (Blue Vessel Left) -->
  <path d="M34 16 L34 32 C34 35 36 37 38 37 L40 37 L40 16 Z" fill="url(#pulmonaryBlue)" stroke="#1E40AF" stroke-width="1.5"/>

  <!-- Aortic Arch with 3 Branching Arteries -->
  <path d="M42 28 C42 16 58 14 62 26 L62 36 L54 36 L54 28 C53 23 47 24 46 28 Z" fill="url(#aortaGrad)" stroke="#7F1D1D" stroke-width="1.8"/>
  <path d="M46 16 L46 22 M50 14 L50 20 M54 15 L54 21" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Pulmonary Artery Arch (Blue) -->
  <path d="M44 32 C48 30 56 34 58 38 L48 42 Z" fill="url(#pulmonaryBlue)"/>

  <!-- Anatomical Heart Ventricles & Atria -->
  <path d="M32 36 C24 38 20 46 22 56 C24 66 38 78 48 86 C58 78 74 66 74 52 C74 42 66 36 56 38 C52 39 48 43 48 43 C48 43 44 38 32 36 Z" fill="url(#heartMuscle)" stroke="#450A0A" stroke-width="2"/>

  <!-- Coronary Arteries (Blood supply branch on heart surface) -->
  <path d="M48 46 Q44 56 40 64 M44 56 Q52 62 56 70" stroke="#FCA5A5" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M42 60 Q36 64 34 68" stroke="#FCA5A5" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Dynamic ECG Heartbeat Wave Overlaid -->
  <path d="M12 50 L26 50 L30 42 L34 58 L38 36 L42 62 L46 48 L50 52 L54 50 L84 50" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <path d="M12 50 L26 50 L30 42 L34 58 L38 36 L42 62 L46 48 L50 52 L54 50 L84 50" stroke="#FBBF24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
