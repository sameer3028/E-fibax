<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="bloodDropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="60%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="pancreasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background Circle Soft Tint -->
  <circle cx="48" cy="48" r="46" fill="#FFF1F2" stroke="#FFE4E6" stroke-width="2"/>

  <!-- Pancreas Graphic (Elongated organ behind) -->
  <path d="M22 64 C24 58 32 54 44 56 C56 58 68 52 74 46 C76 44 78 48 76 52 C72 60 58 66 44 64 C34 62 26 68 22 64 Z" fill="url(#pancreasGrad)" stroke="#B45309" stroke-width="1.6"/>
  <circle cx="30" cy="62" r="1.5" fill="#D97706"/>
  <circle cx="42" cy="61" r="1.5" fill="#D97706"/>
  <circle cx="56" cy="58" r="1.5" fill="#D97706"/>

  <!-- Blood Glucose Drop (Centerpiece) -->
  <path d="M48 14 C48 14 30 38 30 52 C30 62 38 70 48 70 C58 70 66 62 66 52 C66 38 48 14 48 14 Z" fill="url(#bloodDropGrad)" stroke="#7F1D1D" stroke-width="2"/>

  <!-- Blood Drop Highlight Reflection -->
  <path d="M38 44 C36 48 36 54 38 58 C37 54 37 48 40 44 C42 41 45 37 47 34 C44 38 40 41 38 44 Z" fill="#FFFFFF" opacity="0.6"/>

  <!-- Digital Glucometer Display Screen Inside Drop -->
  <rect x="38" y="44" width="20" height="15" rx="3.5" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
  
  <!-- Digital Reading "100" mg/dL -->
  <text x="48" y="53.5" text-anchor="middle" font-family="monospace" font-weight="900" font-size="7" fill="#34D399">100</text>
  <text x="48" y="57.5" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="3" fill="#A7F3D0">mg/dL</text>

  <!-- Sugar Crystals / Glucose Hexagon Rings -->
  <path d="M72 26 L76 28 L76 33 L72 35 L68 33 L68 28 Z" stroke="#F43F5E" stroke-width="1.5" fill="#FFE4E6"/>
  <path d="M22 32 L25 33.5 L25 37 L22 38.5 L19 37 L19 33.5 Z" stroke="#F43F5E" stroke-width="1.3" fill="#FFE4E6"/>
</svg>
