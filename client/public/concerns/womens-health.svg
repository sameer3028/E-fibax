<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="femaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#9D174D"/>
    </linearGradient>
    <linearGradient id="lotusPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBCFE8"/>
      <stop offset="60%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="glowWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
  </defs>

  <!-- Background Circle Soft Tint -->
  <circle cx="48" cy="48" r="46" fill="#FDF2F8" stroke="#FCE7F3" stroke-width="2"/>

  <!-- Female Venus Symbol (Cross below circle) -->
  <circle cx="48" cy="40" r="22" stroke="url(#femaleGrad)" stroke-width="5" fill="#FFFFFF"/>
  <path d="M48 62 L48 84 M37 73 L59 73" stroke="url(#femaleGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Blooming Lotus / Hormonal Harmony Graphic inside Circle -->
  <!-- Center Petal -->
  <path d="M48 24 C44 32 44 42 48 48 C52 42 52 32 48 24 Z" fill="url(#lotusPink)" stroke="#9D174D" stroke-width="1.2"/>
  
  <!-- Left Petals -->
  <path d="M48 48 C42 45 34 38 34 30 C40 30 45 38 48 48 Z" fill="url(#lotusPink)" stroke="#9D174D" stroke-width="1.2" opacity="0.9"/>
  <path d="M48 48 C40 47 30 44 28 38 C34 35 42 42 48 48 Z" fill="url(#lotusPink)" stroke="#9D174D" stroke-width="1.2" opacity="0.75"/>

  <!-- Right Petals -->
  <path d="M48 48 C54 45 62 38 62 30 C56 30 51 38 48 48 Z" fill="url(#lotusPink)" stroke="#9D174D" stroke-width="1.2" opacity="0.9"/>
  <path d="M48 48 C56 47 66 44 68 38 C62 35 54 42 48 48 Z" fill="url(#lotusPink)" stroke="#9D174D" stroke-width="1.2" opacity="0.75"/>

  <!-- Golden Dewdrop of Vitality / Cycle Regularity -->
  <circle cx="48" cy="38" r="2.5" fill="#FBBF24" stroke="#D97706" stroke-width="0.8"/>

  <!-- Harmony Sparkles -->
  <path d="M22 20 L23.5 23 L26.5 24.5 L23.5 26 L22 29 L20.5 26 L17.5 24.5 L20.5 23 Z" fill="#EC4899"/>
  <path d="M74 20 L75.5 23 L78.5 24.5 L75.5 26 L74 29 L72.5 26 L69.5 24.5 L72.5 23 Z" fill="#EC4899"/>
